<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>History Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; padding: 20px; }
    .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
    th { background: #f9fafb; }
    .status-badge { padding: 4px 8px; border-radius: 6px; font-size: 12px; color: white; }
    .status-received { background: #10b981; }
    .status-pending { background: #f59e0b; }
    .status-failed { background: #ef4444; }
    .filter-section { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .scrollable { max-height: 400px; overflow-y: auto; }
  </style>
</head>
<body>

<div class="card">
  <h1 class="text-2xl font-bold mb-4">📜 Transaction History</h1>

  <div class="filter-section">
    <select id="filterType" class="select select-bordered">
      <option value="">All Types</option>
      <option value="export">Export</option>
      <option value="import">Import</option>
    </select>

    <select id="filterStatus" class="select select-bordered">
      <option value="">All Status</option>
      <option value="pending">Pending</option>
      <option value="received">Received</option>
      <option value="failed">Failed</option>
    </select>

    <button class="btn btn-primary" onclick="applyFilters()">Apply Filters</button>
  </div>

  <div class="scrollable">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Type</th>
          <th>Partner</th>
          <th>Product</th>
          <th>Quantity</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="historyTable">
        <!-- Logs will be dynamically inserted here -->
      </tbody>
    </table>
  </div>
</div>

<script>
const token = localStorage.getItem("token");
if (!token) {
  alert("Not logged in");
  window.location.href = "login.html";
}

let allLogs = [];

// Fetch logs from backend
async function fetchLogs() {
  try {
    const res = await fetch("/api/logs", {
      headers: { "Authorization": `Bearer ${token}` },
    });
    allLogs = await res.json();
    renderTable(allLogs);
  } catch (err) {
    console.error("Error fetching logs:", err);
    alert("Failed to fetch logs");
  }
}

// Render logs table
function renderTable(logs) {
  const tbody = document.getElementById("historyTable");
  tbody.innerHTML = "";
  logs.forEach(log => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${new Date(log.date).toLocaleString()}</td>
      <td>${log.type}</td>
      <td>${log.partnerName || log.partnerMobile}</td>
      <td>${log.productName}</td>
      <td>${log.quantity}</td>
      <td>
        <span class="status-badge ${
          log.status === 'received' ? 'status-received' :
          log.status === 'pending' ? 'status-pending' :
          'status-failed'
        }">${log.status}</span>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

// Filter logs
function applyFilters() {
  const type = document.getElementById("filterType").value;
  const status = document.getElementById("filterStatus").value;

  const filtered = allLogs.filter(log => {
    return (type ? log.type === type : true) &&
           (status ? log.status === status : true);
  });
  renderTable(filtered);
}

// Initialize
fetchLogs();
</script>

</body>
</html>
