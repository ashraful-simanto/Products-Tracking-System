<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Product QR Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; padding: 20px; }
    .card { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    h2 { text-align: center; margin-bottom: 20px; }
    input, textarea, button { width: 100%; padding: 10px; margin-top: 10px; font-size: 14px; }
    textarea { resize: vertical; }
    button { background: #10b981; color: white; border: none; cursor: pointer; font-size: 16px; border-radius: 6px; }
    button:hover { background: #059669; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    #qrPreview { display: block; margin: 20px auto 0; max-width: 300px; border: 1px solid #ccc; padding: 10px; background: #fff; }
  </style>
</head>
<body>

<div class="card">
  <h2>📦 Product QR Code Generator</h2>

  <input id="productName" placeholder="Product Name" />
  <div class="grid">
    <input id="producedDate" type="date" />
    <input id="expiryDate" type="date" />
  </div>
  <div class="grid">
    <input id="quantity" type="number" placeholder="Quantity" />
    <input id="price" type="number" placeholder="Price" />
  </div>
  <input id="factoryAddress" placeholder="Factory Address" />
  <input id="owner" placeholder="Owner ID" disabled />
  <textarea id="description" rows="3" placeholder="Product Description"></textarea>

  <button onclick="generateQR()">Generate & Save QR</button>

  <img id="qrPreview" src="" alt="QR Code Preview" />
  <button onclick="window.location.href='dashboard.html'">Return</button>
</div>

<script>
const user = JSON.parse(localStorage.getItem("user"));
const token = localStorage.getItem("token");

if (!user || !token || user.role !== "producer") {
  alert("Unauthorized access");
  window.location.href = "login.html";
}

// Set owner field in UI
document.getElementById("owner").value = user._id;

async function generateQR() {
  // Collect input data
  const productName = document.getElementById("productName").value.trim();
  const producedDate = document.getElementById("producedDate").value;
  const expiryDate = document.getElementById("expiryDate").value;
  const quantity = document.getElementById("quantity").value;
  const price = document.getElementById("price").value;
  const factoryAddress = document.getElementById("factoryAddress").value.trim();
  const description = document.getElementById("description").value.trim();
  const owner = user._id;

  // Validation
  if (!productName || !producedDate || !expiryDate || quantity === "" || price === "" || !owner) {
    alert("Please fill all required fields");
    return;
  }

  const data = {
    productName,
    producedDate,
    expiryDate,
    quantity: Number(quantity),
    price: Number(price),
    factoryAddress,
    description,
    owner
  };

  try {
    // Generate QR
    const qrData = encodeURIComponent(JSON.stringify(data));
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${qrData}`;
    const qrImage = await urlToBase64(qrUrl); // This will be stored in DB

    // Show preview
    document.getElementById("qrPreview").src = qrImage;

    // Send to backend
    const res = await fetch("http://localhost:3000/api/products", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify({ ...data, qrImage })
    });

    const result = await res.json();

    if (res.status === 201 && result.success) {
      alert("✅ Product saved successfully!");
      // Reset form
      document.getElementById("productName").value = "";
      document.getElementById("producedDate").value = "";
      document.getElementById("expiryDate").value = "";
      document.getElementById("quantity").value = "";
      document.getElementById("price").value = "";
      document.getElementById("factoryAddress").value = "";
      document.getElementById("description").value = "";
      document.getElementById("qrPreview").src = "";
    } else {
      alert("❌ Failed: " + (result.message || "Unknown error"));
    }
  } catch (err) {
    console.error(err);
    alert("❌ Error saving product");
  }
}

// Convert URL to Base64
async function urlToBase64(url) {
  const response = await fetch(url);
  const blob = await response.blob();
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.readAsDataURL(blob);
  });
}
</script>

</body>
</html>
