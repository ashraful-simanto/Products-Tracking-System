<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Current Stock</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }
    .card {
      max-width: 900px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    h2 { text-align: center; margin-bottom: 20px; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #10b981;
      color: white;
    }
    tr:hover {
      background-color: #f1f5f9;
    }
    .small-text {
      font-size: 12px;
      color: #555;
    }
    .status-low {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>📦 Current Stock</h2>
  <table id="stockTable">
    <thead>
      <tr>
        <th>Product Name</th>
        <th>Quantity</th>
        <th>Price (BDT)</th>
        <th>Additional Info</th>
      </tr>
    </thead>
    <tbody>
      <!-- Stock items will be inserted here -->
    </tbody>
  </table>
</div>

<script>
const user = JSON.parse(localStorage.getItem("user"));
const token = localStorage.getItem("token");

if (!user) {
  alert("Please login first");
  window.location.href = "login.html";
}

// Fetch products
async function loadStock() {
  try {
    const res = await fetch("http://localhost:3000/api/products", {
      headers: { 
        "Authorization": `Bearer ${token}` 
      }
    });

    if (res.status === 401) {
      alert("Invalid token. Please login again.");
      window.location.href = "login.html";
      return;
    }

    const products = await res.json();

    const tableBody = document.querySelector("#stockTable tbody");
    tableBody.innerHTML = "";

    if (!products.length) {
      tableBody.innerHTML = `<tr><td colspan="4" style="text-align:center">No products found</td></tr>`;
      return;
    }

    products.forEach(p => {
      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${p.productName}</td>
        <td class="${p.quantity < 10 ? 'status-low' : ''}">${p.quantity}</td>
        <td>${p.price.toLocaleString()}</td>
        <td class="small-text">
          Produced: ${new Date(p.producedDate).toLocaleDateString()}<br>
          Expiry: ${new Date(p.expiryDate).toLocaleDateString()}<br>
          Factory: ${p.factoryAddress || 'N/A'}<br>
          Description: ${p.description || 'N/A'}
        </td>
      `;
      tableBody.appendChild(tr);
    });

  } catch (err) {
    console.error(err);
    alert("Error loading stock");
  }
}

// Load stock on page load
loadStock();
</script>

</body>
</html>
