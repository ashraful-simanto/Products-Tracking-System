<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Product Tracking System</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      input[type="number"] { -moz-appearance: textfield; }
      .password-toggle { cursor: pointer; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #666; }
    </style>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-emerald-50 to-white flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <div class="mb-6">
        <a href="./index.html" class="text-emerald-600 hover:text-emerald-700 font-medium flex items-center gap-2">
          <i class="fas fa-arrow-left"></i> Back to Home
        </a>
      </div>

      <div class="card bg-white shadow-xl border border-emerald-100">
        <div class="card-body p-8">
          <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-emerald-100 mb-4">
              <i class="fas fa-lock text-2xl text-emerald-600"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800">Welcome Back</h1>
            <p class="text-gray-600 mt-2">Login to your account</p>
          </div>

          <form id="loginForm">
            <div class="form-control mb-6">
              <label class="label"><span class="label-text text-gray-700 font-medium">Mobile Number *</span></label>
              <input type="number" id="mobile" class="input input-bordered border-emerald-300 w-full" placeholder="017XXXXXXXX" required />
            </div>

            <div class="form-control mb-1">
              <label class="label"><span class="label-text text-gray-700 font-medium">Password *</span></label>
              <div class="relative">
                <input type="password" id="password" class="input input-bordered border-emerald-300 w-full pr-10" placeholder="Enter password" required />
                <span class="password-toggle" onclick="togglePassword()">
                  <i id="eyeIcon" class="fas fa-eye"></i>
                </span>
              </div>
            </div>

            <div class="text-right mb-6">
              <a href="#" class="text-sm text-emerald-600 font-medium">Forgot Password?</a>
            </div>

            <button type="submit" class="btn bg-emerald-600 text-white w-full hover:bg-emerald-700">
              <i class="fas fa-sign-in-alt mr-2"></i> Login
            </button>

            <div class="mt-6 p-4 bg-emerald-50 rounded-lg border border-emerald-200">
              <h3 class="text-sm font-medium text-emerald-800 mb-2"><i class="fas fa-lightbulb"></i> Demo Credentials</h3>
              <div class="text-xs text-emerald-700">
                <p>Mobile: 01700000000 | Password: demo123</p>
              </div>
            </div>

            <div class="divider my-8 text-gray-400">OR</div>
            <div class="text-center">
              <p class="text-gray-600">Don't have an account? <a href="registration.html" class="text-emerald-600 font-medium">Sign up here</a></p>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="login.js"></script>
  </body>
</html>
