<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Product Tracking System</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      input[type="number"] { -moz-appearance: textfield; }
      .password-toggle { cursor: pointer; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #666; }
      .select-custom { appearance: none; background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2334d399' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e"); background-position: right 0.5rem center; background-repeat: no-repeat; background-size: 1.5em 1.5em; padding-right: 2.5rem; }
      .theme-color { color: #34d399; }
      .theme-bg { background-color: #34d399; }
      .theme-border { border-color: #34d399; }
      .theme-hover:hover { background-color: #10b981; border-color: #10b981; }
      .text-red-500 { color: #f87171; }
    </style>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-emerald-50 to-white flex items-center justify-center p-4">
    <div class="w-full max-w-lg">
      <div class="mb-6">
        <a href="./index.html" class="text-emerald-600 hover:text-emerald-700 font-medium flex items-center gap-2">
          <i class="fas fa-arrow-left"></i> Back to Home
        </a>
      </div>

      <div class="card bg-white shadow-xl border border-emerald-100">
        <div class="card-body p-8">
          <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-emerald-100 mb-4">
              <i class="fas fa-user-plus text-2xl theme-color"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800">Create Account</h1>
            <p class="text-gray-600 mt-2">Register for Product Tracking System</p>
          </div>

          <form id="registrationForm">
            <!-- Role -->
            <div class="form-control mb-6">
              <label class="label"><span class="label-text text-gray-700 font-medium">Register As *</span></label>
              <select id="userType" class="select select-bordered border-emerald-300 w-full select-custom" required>
                <option value="" disabled selected>Select your role</option>
                <option value="customer">Customer</option>
                <option value="shopkeeper">Shopkeeper</option>
                <option value="distributor">Distributor</option>
                <option value="producer">Producer</option>
              </select>
            </div>

            <!-- NID -->
            <div class="form-control mb-6" id="nidContainer">
              <label class="label">
                <span class="label-text text-gray-700 font-medium">NID Card Number
                  <span id="nidNote" class="text-gray-500 font-normal">(Optional for customers)</span>
                </span>
              </label>
              <input type="number" id="nidNumber" class="input input-bordered border-emerald-300 w-full" placeholder="Enter your NID card number"/>
            </div>

            <!-- Mobile -->
            <div class="form-control mb-6">
              <label class="label"><span class="label-text text-gray-700 font-medium">Mobile Number *</span></label>
              <input type="number" id="mobile" class="input input-bordered border-emerald-300 w-full" placeholder="01XXXXXXXXX" required maxlength="11"/>
              <div class="text-xs text-red-500 mt-1 hidden" id="mobileError">Mobile number must be 11 digits starting with 01</div>
            </div>

            <!-- Password -->
            <div class="form-control mb-6">
              <label class="label"><span class="label-text text-gray-700 font-medium">Password *</span></label>
              <div class="relative">
                <input type="password" id="password" class="input input-bordered border-emerald-300 w-full pr-10" placeholder="Create password" required/>
                <span class="password-toggle" onclick="togglePassword('password', 'passwordEye')">
                  <i id="passwordEye" class="fas fa-eye"></i>
                </span>
              </div>
              <div class="text-xs text-red-500 mt-1 hidden" id="passwordError">Password must be at least 6 characters</div>
            </div>

            <!-- Confirm Password -->
            <div class="form-control mb-6">
              <label class="label"><span class="label-text text-gray-700 font-medium">Confirm Password *</span></label>
              <div class="relative">
                <input type="password" id="confirmPassword" class="input input-bordered border-emerald-300 w-full pr-10" placeholder="Re-enter password" required/>
                <span class="password-toggle" onclick="togglePassword('confirmPassword', 'confirmPasswordEye')">
                  <i id="confirmPasswordEye" class="fas fa-eye"></i>
                </span>
              </div>
              <div class="text-xs text-red-500 mt-1 hidden" id="confirmPasswordError">Passwords do not match</div>
            </div>

            <!-- Terms -->
            <div class="form-control mb-8">
              <label class="label cursor-pointer justify-start gap-3">
                <input type="checkbox" id="terms" class="checkbox checkbox-sm theme-border" required/>
                <span class="label-text text-gray-700">I agree to the
                  <a href="#" class="theme-color font-medium hover:underline">Terms</a> and
                  <a href="#" class="theme-color font-medium hover:underline">Privacy Policy</a>
                </span>
              </label>
              <div class="text-xs text-red-500 mt-1 hidden" id="termsError">You must agree to terms</div>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn theme-bg text-white w-full py-3 text-lg font-medium">
              <i class="fas fa-user-plus mr-2"></i>Create Account
            </button>

            <div class="text-center mt-6">
              <p class="text-gray-600">Already have an account?
                <a href="login.html" class="theme-color hover:text-emerald-700 font-medium">Login here</a>
              </p>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      // Toggle password visibility
      function togglePassword(fieldId, eyeId) {
        const field = document.getElementById(fieldId);
        const eye = document.getElementById(eyeId);
        if (field.type === "password") {
          field.type = "text"; eye.classList.replace("fa-eye", "fa-eye-slash");
        } else {
          field.type = "password"; eye.classList.replace("fa-eye-slash", "fa-eye");
        }
      }

      // Show/hide NID based on role
      document.getElementById("userType").addEventListener("change", function () {
        const nidContainer = document.getElementById("nidContainer");
        const nidNote = document.getElementById("nidNote");
        const role = this.value;

        if (role === "customer") {
          nidContainer.classList.remove("hidden");
          nidNote.textContent = "(Optional for customers)";
          nidNote.className = "text-gray-500 font-normal";
          document.getElementById("nidNumber").required = false;
        } else if (role === "producer") {
          nidContainer.classList.remove("hidden");
          nidNote.textContent = "(Required)";
          nidNote.className = "text-red-500 font-normal";
          document.getElementById("nidNumber").required = true;
        } else {
          nidContainer.classList.remove("hidden");
          nidNote.textContent = "(Recommended)";
          nidNote.className = "text-amber-500 font-normal";
          document.getElementById("nidNumber").required = false;
        }
      });

      // Mobile validation
      document.getElementById("mobile").addEventListener("input", function () {
        const mobileError = document.getElementById("mobileError");
        const val = this.value;
        if (!/^01\d{9}$/.test(val)) mobileError.classList.remove("hidden");
        else mobileError.classList.add("hidden");
      });

      // Password & Confirm validation
      const passwordField = document.getElementById("password");
      const confirmField = document.getElementById("confirmPassword");
      passwordField.addEventListener("input", checkPassword);
      confirmField.addEventListener("input", checkPassword);
      function checkPassword() {
        const p = passwordField.value;
        const c = confirmField.value;
        document.getElementById("passwordError").classList.toggle("hidden", p.length >= 6);
        document.getElementById("confirmPasswordError").classList.toggle("hidden", p === c);
      }

      // Form submit
      document.getElementById("registrationForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        let isValid = true;
        const role = document.getElementById("userType").value;
        const mobile = document.getElementById("mobile").value;
        const password = passwordField.value;
        const confirm = confirmField.value;
        const terms = document.getElementById("terms").checked;

        // Prevent admin registration
        if (role === "admin") { alert("Admin registration is not allowed"); return; }

        if (!role) { alert("Select your role"); isValid = false; }
        if (!/^01\d{9}$/.test(mobile)) { document.getElementById("mobileError").classList.remove("hidden"); isValid = false; }
        if (password.length < 6) { document.getElementById("passwordError").classList.remove("hidden"); isValid = false; }
        if (password !== confirm) { document.getElementById("confirmPasswordError").classList.remove("hidden"); isValid = false; }
        if (!terms) { document.getElementById("termsError").classList.remove("hidden"); isValid = false; }
        if (!isValid) return;

        const formData = {
          userType: role,
          nidNumber: document.getElementById("nidNumber").value || null,
          mobile,
          password
        };

        const submitBtn = this.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Creating Account...';
        submitBtn.disabled = true;

        try {
          const res = await fetch("http://localhost:3000/api/users", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(formData),
          });
          const result = await res.json();
          if (res.ok) {
            alert("Registration successful! Redirecting to login...");
            setTimeout(() => window.location.href = "login.html", 1500);
          } else {
            throw new Error(result.message || "Registration failed");
          }
        } catch (err) {
          alert("Registration failed: " + err.message);
        } finally {
          submitBtn.innerHTML = originalText;
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
